# Morning IST refresh. GitHub cron is UTC: 01:30 UTC = 07:00 IST.
# This job is not the Flask process. It does not start the 15-minute news thread.
#
# send_test_reminder (workflow_dispatch only):
#   true  -> python scripts/send_reminders.py --test
#            Sends one test email when SMTP_USER, SMTP_PASS, and NOTIFY_EMAIL
#            are set as Actions secrets. If they are missing, the script prints
#            a skip line and exits 0. It does not record a results reminder.
#   false -> python scripts/send_reminders.py --send
#            Emails only stocks whose next result date is exactly 10 or 5 days away.
name: Daily results refresh

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      send_test_reminder:
        description: "Send one test reminder instead of the normal 10-day and 5-day scan"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Refresh results
        run: python scripts/refresh_results.py

      - name: Send result reminders
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.send_test_reminder }}" = "true" ]; then
            python scripts/send_reminders.py --test
          else
            python scripts/send_reminders.py --send
          fi

      - name: Commit data updates
        run: |
          git add -- data/results.json data/reminders_sent.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh results and reminder log"
          git push
