target-version = "py311"
line-length = 100
extend-exclude = ["venv", ".venv"]

[lint]
# Pyflakes plus pycodestyle errors and import order.
# Broad `except Exception` stays: a source or summary failure must not crash search.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[lint.per-file-ignores]
# The temp history path has to be set before app.py creates the SQLite file.
"tests/test_smoke.py" = ["E402"]
