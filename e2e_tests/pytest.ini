[pytest]
base_url = https://ridz111.pythonanywhere.com
addopts = -v -ra --tb=short --durations=10 -p no:cacheprovider
timeout = 240
markers =
    api:  HTTP/API tests against the live site (fast, no browser)
    ui:   Real-browser end-to-end tests (Playwright)
    unit: Local tests of app.py with a mocked news fetcher (no internet)
    slow: Load / performance tests (skipped with --quick)
