<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#141210">
    <title>Indian Stock News Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ink: #141210;
            --ink-soft: #3a342c;
            --paper: #f3eee6;
            --card: #fffdf8;
            --line: #e3dacb;
            --muted: #6f675c;
            --amber: #e09a2b;
            --amber-deep: #8a5a10;
            --cream: #f7f3ea;
            --danger: #8f3d2b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "Segoe UI", Helvetica, Arial, sans-serif;
            padding: 0 0 2rem;
        }

        h1, h2, h3, p { margin: 0; }

        .sheet {
            width: min(880px, calc(100% - 28px));
            margin: 0 auto;
        }

        .mast {
            background: var(--ink);
            color: var(--cream);
            padding: 22px 0 20px;
        }

        .mast-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--amber);
            color: var(--ink);
            font-weight: 800;
            display: grid;
            place-items: center;
            letter-spacing: -0.04em;
            flex: none;
            font-size: 0.95rem;
        }

        .eyebrow {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #c7bbaa;
            margin-bottom: 3px;
        }

        .brand h1 {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 1.55rem;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--cream);
            text-shadow: none;
        }

        .ghost-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--cream);
            border: 1px solid #4a433a;
            border-radius: 999px;
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .ghost-btn:hover { border-color: var(--amber); color: var(--amber); }

        .finder {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card);
            border-radius: 14px;
            padding: 6px;
            border: 1px solid #2a261f;
            position: relative;
            z-index: 5;
        }

        .suggest {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 8px);
            background: var(--card);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 16px 36px rgba(20, 18, 16, 0.18);
            z-index: 30;
            max-height: 320px;
            overflow-y: auto;
            padding: 4px;
        }

        .suggest[hidden] { display: none; }

        .suggest-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            text-align: left;
            cursor: pointer;
            font: inherit;
        }

        .suggest-row:hover { background: #f6ead2; }

        .suggest-row.is-active,
        .suggest-row.is-active:hover {
            background: var(--amber);
            color: var(--ink);
        }

        .suggest-name {
            font-weight: 650;
            min-width: 0;
        }

        .suggest-symbol {
            flex: none;
            font-weight: 800;
            letter-spacing: 0.04em;
            font-size: 0.78rem;
            color: var(--amber-deep);
        }

        .suggest-row.is-active .suggest-symbol { color: var(--ink); }

        .suggest-empty {
            padding: 12px 14px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .finder:focus-within {
            outline: 2px solid var(--amber);
            outline-offset: 3px;
        }

        .finder input {
            flex: 1;
            min-width: 0;
            border: 0;
            background: transparent;
            color: var(--ink);
            font-size: 1.05rem;
            padding: 10px 12px;
            font-family: inherit;
        }

        .finder input:focus { outline: none; }
        .finder input::placeholder { color: #9a9084; }

        .btn-go {
            background: var(--amber);
            color: var(--ink);
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 800;
            letter-spacing: 0.01em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-go:hover { background: #f0ad45; }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex: none;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
        }

        .icon-btn:hover { background: #f3eee6; color: var(--ink); }

        .finder.is-busy { opacity: 0.7; pointer-events: none; }
        .finder.is-busy #refreshBtn i { animation: spin 0.7s linear infinite; }

        @keyframes spin { to { transform: rotate(360deg); } }

        main.sheet { padding-top: 18px; }

        .recent {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px;
            margin-bottom: 6px;
        }

        .recent-label {
            flex: none;
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 700;
            position: sticky;
            left: 0;
            background: var(--paper);
            padding-right: 4px;
        }

        .stock-chip {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            color: var(--ink);
            border: 1px solid #d5cbbd;
            border-radius: 999px;
            padding: 7px 10px 7px 12px;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            letter-spacing: 0.01em;
        }

        .stock-chip:hover { border-color: var(--ink); }

        .stock-chip.is-current {
            background: var(--ink);
            color: var(--cream);
            border-color: var(--ink);
            box-shadow: inset 0 -2px 0 var(--amber);
        }

        .remove-chip {
            font-size: 0.72rem;
            opacity: 0.4;
            font-style: normal;
        }

        .stock-chip:hover .remove-chip { opacity: 1; color: var(--danger); }
        .stock-chip.is-current .remove-chip { color: var(--amber); opacity: 0.9; }

        .results-head {
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-areas:
                "kicker kicker"
                "symbol count";
            align-items: end;
            gap: 4px 16px;
            margin: 14px 0 12px;
        }

        .results-head .eyebrow {
            grid-area: kicker;
            color: var(--muted);
        }

        .results-symbol {
            grid-area: symbol;
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 2rem;
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .results-count {
            grid-area: count;
            color: var(--muted);
            font-size: 0.9rem;
            padding-bottom: 4px;
        }

        .cache-note {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin: 8px 0 4px;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .text-btn {
            background: transparent;
            border: 0;
            color: var(--amber-deep);
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            font-size: 0.9rem;
        }

        .text-btn:hover { color: var(--ink); }

        .story {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 18px 14px;
            margin: 0 0 10px;
        }

        .story-title {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 1.22rem;
            line-height: 1.28;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .story-dek {
            color: #4e483f;
            font-size: 0.95rem;
            line-height: 1.45;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .story-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: var(--muted);
        }

        .story-source {
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            font-size: 0.7rem;
        }

        .story-link {
            margin-left: auto;
            color: var(--amber-deep);
            font-weight: 800;
            text-decoration: none;
            font-size: 0.88rem;
        }

        .story-link:hover { color: var(--ink); }

        .state {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 28px 22px;
            margin-top: 12px;
        }

        .state h3 {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 1.35rem;
            margin-bottom: 6px;
        }

        .state p { color: var(--muted); line-height: 1.45; }

        .state-error { border-color: #e4cfc6; }
        .state-error h3 { color: var(--danger); }

        .btn-retry {
            margin-top: 14px;
            background: var(--ink);
            color: var(--cream);
            border: 0;
            border-radius: 999px;
            padding: 8px 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-retry:hover { background: #2a241c; }

        .loading { margin-top: 16px; }

        .skeleton {
            height: 92px;
            border-radius: 14px;
            margin-bottom: 10px;
            background: #e7e0d4;
            animation: sheen 1.2s ease-in-out infinite;
        }

        .skeleton.short { width: 70%; height: 72px; }

        .loading p { color: var(--muted); margin-top: 6px; }

        @keyframes sheen {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .desk { margin-top: 8px; }

        .desk-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 12px;
            margin-bottom: 12px;
        }

        .desk-head h2 {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 1.7rem;
            letter-spacing: -0.03em;
        }

        .desk .eyebrow { color: var(--muted); }

        .seg {
            display: inline-flex;
            gap: 4px;
            padding: 4px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
            margin-bottom: 12px;
        }

        .seg-btn.nav-link {
            color: var(--muted) !important;
            background: transparent !important;
            border: 0 !important;
            border-radius: 999px !important;
            padding: 7px 14px !important;
            font-weight: 700;
            font-size: 0.88rem;
        }

        .seg-btn.nav-link.active {
            background: var(--ink) !important;
            color: var(--cream) !important;
        }

        .waiting { color: var(--muted); padding: 12px 2px; }

        .modal-content {
            background: var(--card);
            border: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        .modal-header {
            background: var(--ink);
            color: var(--cream);
            border-bottom: 0;
        }

        .modal-header .modal-title {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
        }

        .modal-header .btn-close { filter: invert(1); }

        .modal-footer { border-top: 1px solid var(--line); }

        #historyList .list-group-item {
            background: transparent;
            border-color: var(--line);
        }

        #historyList h5 {
            font-family: Georgia, "Palatino Linotype", Palatino, serif;
            font-size: 1.05rem;
            color: var(--ink);
        }

        #clearHistoryBtn {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--cream);
            border-radius: 999px;
        }

        .modal-footer .btn-secondary {
            background: transparent;
            color: var(--ink);
            border-color: #d5cbbd;
            border-radius: 999px;
        }

        #goToTopBtn {
            opacity: 0;
            pointer-events: none;
            background: var(--ink);
            color: var(--cream);
            border: 0;
            width: 46px;
            height: 46px;
            bottom: 22px;
            right: 22px;
            z-index: 1000;
            box-shadow: 0 8px 20px rgba(20, 18, 16, 0.25);
        }

        #goToTopBtn.visible { opacity: 1; pointer-events: auto; }

        button:focus-visible,
        a:focus-visible,
        .stock-chip:focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: 2px;
        }

        @media (max-width: 680px) {
            .brand h1 { font-size: 1.2rem; }
            .ghost-btn span { display: none; }
            .finder { flex-wrap: wrap; }
            .finder input { flex: 1 1 100%; }
            .btn-go { flex: 1; justify-content: center; }
            .story-link { margin-left: 0; }
            .results-symbol { font-size: 1.6rem; }
            .desk-head { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <header class="mast">
        <div class="sheet">
            <div class="mast-top">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">IN</div>
                    <div>
                        <p class="eyebrow">Markets desk</p>
                        <h1>Indian Stock News Tracker</h1>
                    </div>
                </div>
                <button type="button" id="historyBtn" class="ghost-btn" title="View search history">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </button>
            </div>
            <form id="searchForm" class="finder" role="search">
                <label class="visually-hidden" for="stockInput">Stock or index</label>
                <input type="text" id="stockInput" placeholder="Company or ticker, such as KPI Green or INFY" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestList" required>
                <div id="suggestList" class="suggest" role="listbox" hidden></div>
                <button type="submit" class="btn-go" id="searchBtn">
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </button>
                <button type="button" id="clearBtn" class="icon-btn" title="Clear search" aria-label="Clear search">
                    <i class="fas fa-times"></i>
                </button>
                <button type="button" id="refreshBtn" class="icon-btn" title="Force refresh news" aria-label="Force refresh news">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </form>
        </div>
    </header>

    <main class="sheet">
        <div id="recentSearches" class="recent"></div>

        <div class="loading" style="display:none" aria-live="polite">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton short"></div>
            <p>Fetching headlines…</p>
        </div>

        <div class="error-message" style="display:none" role="alert">
            <div class="state state-error">
                <h3>Headlines didn't load</h3>
                <p class="error-text"></p>
                <button type="button" id="retryBtn" class="btn-retry">Try again</button>
            </div>
        </div>

        <div id="newsContainer"></div>
    </main>

    <div class="modal fade" id="historyModal" tabindex="-1" aria-labelledby="historyModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="historyModalLabel">Search History</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="historyList" class="list-group"></div>
                    <div id="noHistory" class="text-center mt-3 d-none">
                        <p>No search history found</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="clearHistoryBtn" class="btn btn-danger">Clear History</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <button id="goToTopBtn" class="btn rounded-circle position-fixed" aria-label="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const historyModal = new bootstrap.Modal(document.getElementById('historyModal'));
        const clientCache = new Map();

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function currentSymbol() {
            return document.getElementById('stockInput').value.trim().toUpperCase();
        }

        function syncCurrentChip() {
            const current = currentSymbol();
            document.querySelectorAll('.stock-chip').forEach((chip) => {
                const name = chip.querySelector('.stock-name')?.textContent?.trim().toUpperCase() || '';
                chip.classList.toggle('is-current', Boolean(current) && name === current);
            });
        }

        function formatWhen(value) {
            const date = new Date(value || Date.now());
            if (Number.isNaN(date.getTime())) return '';
            const minutes = Math.round((Date.now() - date.getTime()) / 60000);
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.round(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.round(hours / 24);
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function safeHref(url) {
            try {
                const parsed = new URL(url, window.location.origin);
                if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
            } catch (error) {
                return '#';
            }
            return '#';
        }

        function plainText(value) {
            const holder = document.createElement('div');
            holder.innerHTML = String(value ?? '');
            return holder.textContent.replace(/\s+/g, ' ').trim();
        }

        function storyHtml(item) {
            const rawTitle = item.title || 'Untitled';
            const title = esc(rawTitle);
            const dek = plainText(item.description || '');
            const compact = (text) => text.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const titleKey = compact(rawTitle);
            const dekKey = compact(dek);
            const repeatsTitle = !dekKey || dekKey === titleKey || dekKey.startsWith(titleKey) || titleKey.startsWith(dekKey);
            const showDek = dek
                && dek !== 'No description available'
                && !/^https?:\/\//i.test(dek)
                && !dek.includes('news.google.com/rss')
                && !repeatsTitle;
            const description = showDek ? `<p class="story-dek">${esc(dek)}</p>` : '';
            const source = esc(item.source || 'Unknown source');
            const when = esc(formatWhen(item.published_at));
            const full = esc(new Date(item.published_at || Date.now()).toLocaleString());
            const href = esc(safeHref(item.url || '#'));
            return `
                <article class="story">
                    <h2 class="story-title">${title}</h2>
                    ${description}
                    <div class="story-meta">
                        <span class="story-source">${source}</span>
                        <time title="${full}">${when}</time>
                        <a class="story-link" href="${href}" target="_blank" rel="noopener noreferrer">Read article</a>
                    </div>
                </article>
            `;
        }

        function showError(message) {
            const box = document.querySelector('.error-message');
            box.querySelector('.error-text').textContent = message;
            box.style.display = 'block';
        }

        function hideError() {
            document.querySelector('.error-message').style.display = 'none';
        }

        document.getElementById('historyBtn').addEventListener('click', async () => {
            await loadHistory();
            historyModal.show();
        });

        document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/history', { method: 'DELETE' });
                if (response.ok) {
                    document.getElementById('historyList').innerHTML = '';
                    document.getElementById('noHistory').classList.remove('d-none');
                    updateRecentSearchesDisplay();
                }
            } catch (error) {
                console.error('Error clearing history:', error);
            }
        });

        document.getElementById('retryBtn').addEventListener('click', () => {
            const stock = document.getElementById('stockInput').value.trim();
            if (stock) fetchNews(stock, true);
            else document.getElementById('stockInput').focus();
        });

        async function loadHistory() {
            try {
                const response = await fetch('/api/history');
                if (!response.ok) throw new Error('Failed to load history');

                let history = await response.json();
                const historyList = document.getElementById('historyList');
                const noHistory = document.getElementById('noHistory');
                historyList.innerHTML = '';

                if (history.length === 0) {
                    noHistory.classList.remove('d-none');
                    return;
                }

                noHistory.classList.add('d-none');
                const stockMap = new Map();
                history.reverse().forEach(item => {
                    const stockSymbol = item.stock.toUpperCase();
                    if (!stockMap.has(stockSymbol)) stockMap.set(stockSymbol, item);
                });

                Array.from(stockMap.values()).forEach(item => {
                    const date = new Date(item.timestamp).toLocaleString();
                    const historyItem = document.createElement('a');
                    historyItem.href = '#';
                    historyItem.className = 'list-group-item list-group-item-action';
                    historyItem.innerHTML = `
                        <div class="d-flex w-100 justify-content-between">
                            <h5 class="mb-1">${esc(item.stock)}</h5>
                            <div>
                                <button class="btn btn-sm btn-outline-danger delete-item" data-stock="${esc(item.stock)}" title="Delete this item">
                                    <i class="fas fa-times"></i>
                                </button>
                                <small class="ms-2">${esc(item.count)} results</small>
                            </div>
                        </div>
                        <small class="text-muted">${esc(date)}</small>
                    `;

                    historyItem.addEventListener('click', (e) => {
                        if (!e.target.closest('.delete-item')) {
                            e.preventDefault();
                            document.getElementById('stockInput').value = item.stock;
                            historyModal.hide();
                            fetchNews(item.stock, false);
                        }
                    });

                    historyList.appendChild(historyItem);
                });

                document.querySelectorAll('.delete-item').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const stock = button.getAttribute('data-stock');
                        await deleteHistoryItem(stock);
                        await loadHistory();
                        updateRecentSearchesDisplay();
                    });
                });
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('noHistory').classList.remove('d-none');
            }
        }

        async function deleteHistoryItem(stock) {
            try {
                const response = await fetch(`/api/history/${encodeURIComponent(stock)}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Failed to delete history item');
                return true;
            } catch (error) {
                console.error(`Error deleting history item for ${stock}:`, error);
                return false;
            }
        }

        const suggestList = document.getElementById('suggestList');
        const stockInputEl = document.getElementById('stockInput');
        let suggestItems = [];
        let suggestIndex = -1;
        let suggestTimer = null;
        let suggestAbort = null;

        function closeSuggest() {
            suggestList.hidden = true;
            suggestList.innerHTML = '';
            suggestItems = [];
            suggestIndex = -1;
            stockInputEl.setAttribute('aria-expanded', 'false');
            stockInputEl.removeAttribute('aria-activedescendant');
        }

        function setSuggestIndex(index) {
            if (!suggestItems.length) return;
            suggestIndex = (index + suggestItems.length) % suggestItems.length;
            suggestList.querySelectorAll('.suggest-row').forEach((row, i) => {
                const active = i === suggestIndex;
                row.classList.toggle('is-active', active);
                row.setAttribute('aria-selected', active ? 'true' : 'false');
                if (active) {
                    row.id = 'suggest-active';
                    stockInputEl.setAttribute('aria-activedescendant', 'suggest-active');
                    row.scrollIntoView({ block: 'nearest' });
                } else {
                    row.removeAttribute('id');
                }
            });
        }

        function renderSuggest(items) {
            suggestItems = items;
            if (!items.length) {
                suggestIndex = -1;
                suggestList.innerHTML = '<div class="suggest-empty">No matching stocks</div>';
                suggestList.hidden = false;
                stockInputEl.setAttribute('aria-expanded', 'true');
                stockInputEl.removeAttribute('aria-activedescendant');
                return;
            }
            suggestList.innerHTML = items.map((item, i) => `
                <button type="button" class="suggest-row${i === 0 ? ' is-active' : ''}" role="option" data-index="${i}" aria-selected="${i === 0 ? 'true' : 'false'}" ${i === 0 ? 'id="suggest-active"' : ''}>
                    <span class="suggest-name">${esc(item.name)}</span>
                    <span class="suggest-symbol">${esc(item.symbol)}</span>
                </button>
            `).join('');
            suggestIndex = 0;
            suggestList.hidden = false;
            stockInputEl.setAttribute('aria-expanded', 'true');
            stockInputEl.setAttribute('aria-activedescendant', 'suggest-active');
        }

        function chooseSuggest(index) {
            const item = suggestItems[index];
            if (!item) return;
            stockInputEl.value = item.symbol;
            closeSuggest();
            fetchNews(item.symbol, false);
        }

        async function loadSuggest(query) {
            if (suggestAbort) suggestAbort.abort();
            suggestAbort = new AbortController();
            try {
                const response = await fetch('/api/suggest?q=' + encodeURIComponent(query), {
                    signal: suggestAbort.signal
                });
                if (!response.ok) throw new Error('Could not load suggestions');
                const data = await response.json();
                if (stockInputEl.value.trim().toLowerCase() !== query.toLowerCase()) return;
                renderSuggest(Array.isArray(data) ? data : []);
            } catch (error) {
                if (error.name === 'AbortError') return;
                closeSuggest();
            }
        }

        stockInputEl.addEventListener('input', () => {
            const query = stockInputEl.value.trim();
            clearTimeout(suggestTimer);
            if (query.length < 1) {
                closeSuggest();
                return;
            }
            suggestTimer = setTimeout(() => loadSuggest(query), 150);
        });

        stockInputEl.addEventListener('keydown', (e) => {
            if (suggestList.hidden) return;
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                setSuggestIndex(suggestIndex + 1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                setSuggestIndex(suggestIndex - 1);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closeSuggest();
            } else if (e.key === 'Enter' && suggestIndex >= 0) {
                e.preventDefault();
                chooseSuggest(suggestIndex);
            }
        });

        suggestList.addEventListener('mousedown', (e) => {
            const row = e.target.closest('.suggest-row');
            if (!row) return;
            e.preventDefault();
            chooseSuggest(Number(row.dataset.index));
        });

        suggestList.addEventListener('mousemove', (e) => {
            const row = e.target.closest('.suggest-row');
            if (!row) return;
            const index = Number(row.dataset.index);
            if (index !== suggestIndex) setSuggestIndex(index);
        });

        stockInputEl.addEventListener('blur', () => {
            setTimeout(() => {
                if (!suggestList.contains(document.activeElement)) closeSuggest();
            }, 150);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.finder')) closeSuggest();
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            closeSuggest();
            const stock = document.getElementById('stockInput').value.trim();
            if (!stock) return;
            await fetchNews(stock, false);
        });

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            const stock = document.getElementById('stockInput').value.trim();
            if (!stock) return;
            await fetchNews(stock, true);
        });

        async function fetchNews(stock, forceRefresh) {
            const form = document.getElementById('searchForm');
            document.querySelector('.loading').style.display = 'block';
            hideError();
            document.getElementById('newsContainer').innerHTML = '';
            form.classList.add('is-busy');
            syncCurrentChip();

            if (!forceRefresh && clientCache.has(stock)) {
                const cachedData = clientCache.get(stock);
                displayNews(cachedData);
                document.querySelector('.loading').style.display = 'none';
                form.classList.remove('is-busy');
                const cacheTime = cachedData.timestamp || 0;
                if (Date.now() - cacheTime > 5 * 60 * 1000) refreshInBackground(stock);
                return;
            }

            let params = `stock=${encodeURIComponent(stock)}`;
            if (forceRefresh) params += `&force_refresh=true`;

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                const data = await response.json();
                if (response.ok) {
                    data.timestamp = Date.now();
                    clientCache.set(stock, data);
                    displayNews(data);
                    updateRecentSearchesDisplay();
                } else {
                    throw new Error(data.error || 'Failed to fetch news');
                }
            } catch (error) {
                showError(error.message);
            } finally {
                document.querySelector('.loading').style.display = 'none';
                form.classList.remove('is-busy');
            }
        }

        async function refreshInBackground(stock) {
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `stock=${encodeURIComponent(stock)}&force_refresh=true&background=true`
                });
                if (response.ok) {
                    const data = await response.json();
                    data.timestamp = Date.now();
                    clientCache.set(stock, data);
                    const currentStock = document.getElementById('stockInput').value.trim();
                    if (currentStock.toUpperCase() === stock.toUpperCase()) displayNews(data);
                }
            } catch (error) {
                console.error(`Background refresh error for ${stock}:`, error);
            }
        }

        function displayNews(data) {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            hideError();
            syncCurrentChip();

            if (!data) {
                container.innerHTML = `
                    <div class="state">
                        <h3>Nothing came back</h3>
                        <p>The desk didn't receive a response. Try the search again.</p>
                    </div>`;
                return;
            }

            let news = [];
            if (Array.isArray(data)) news = data;
            else if (data.news && Array.isArray(data.news)) news = data.news;
            else if (typeof data === 'object') news = data.news || [];

            if (!Array.isArray(news) || news.length === 0) {
                container.innerHTML = `
                    <div class="state">
                        <h3>No headlines for this ticker</h3>
                        <p>Nothing matched. Try a company name or an index such as NIFTY50.</p>
                    </div>`;
                return;
            }

            const symbol = document.getElementById('stockInput').value.trim() || 'Results';
            let html = '';
            if (data.cached || data.stale) {
                html += `
                    <div class="cache-note">
                        <span>Showing an earlier copy of these headlines.</span>
                        <button type="button" class="text-btn" id="refreshCacheBtn">Refresh</button>
                    </div>`;
            }
            html += `
                <div class="results-head">
                    <p class="eyebrow">Now reading</p>
                    <p class="results-symbol">${esc(symbol)}</p>
                    <p class="results-count">${news.length} ${news.length === 1 ? 'story' : 'stories'}</p>
                </div>`;
            news.forEach(item => {
                if (!item) return;
                html += storyHtml(item);
            });
            container.innerHTML = html;

            const refreshCacheBtn = document.getElementById('refreshCacheBtn');
            if (refreshCacheBtn) {
                refreshCacheBtn.addEventListener('click', () => {
                    const stock = document.getElementById('stockInput').value.trim();
                    if (stock) fetchNews(stock, true);
                });
            }
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            document.getElementById('stockInput').value = '';
            closeSuggest();
            hideError();
            showWelcomeMessage();
            syncCurrentChip();
            document.getElementById('stockInput').focus();
        });

        async function updateRecentSearchesDisplay() {
            try {
                const response = await fetch('/api/history');
                if (!response.ok) throw new Error('Failed to load history');

                let history = await response.json();
                const recentSearches = document.getElementById('recentSearches');
                recentSearches.innerHTML = '';
                if (history.length === 0) return;

                const stockMap = new Map();
                history.reverse().forEach(item => {
                    const stockSymbol = item.stock.toUpperCase();
                    if (!stockMap.has(stockSymbol)) stockMap.set(stockSymbol, item);
                });

                const recentStocks = Array.from(stockMap.values()).slice(0, 5);
                if (recentStocks.length === 0) return;

                const label = document.createElement('div');
                label.className = 'recent-label';
                label.textContent = 'Recent';
                recentSearches.appendChild(label);

                const active = currentSymbol();
                recentStocks.forEach(item => {
                    const chip = document.createElement('div');
                    chip.className = 'stock-chip' + (item.stock.toUpperCase() === active ? ' is-current' : '');
                    chip.tabIndex = 0;

                    const stockNameSpan = document.createElement('span');
                    stockNameSpan.textContent = item.stock;
                    stockNameSpan.className = 'stock-name';

                    const removeIcon = document.createElement('i');
                    removeIcon.className = 'fas fa-times remove-chip';
                    removeIcon.title = `Remove ${item.stock} from recent searches`;

                    chip.appendChild(stockNameSpan);
                    chip.appendChild(removeIcon);

                    const openChip = () => {
                        document.getElementById('stockInput').value = item.stock;
                        syncCurrentChip();
                        if (clientCache.has(item.stock)) {
                            const cachedData = clientCache.get(item.stock);
                            displayNews(cachedData);
                            const cacheTime = cachedData.timestamp || 0;
                            if (Date.now() - cacheTime > 5 * 60 * 1000) refreshInBackground(item.stock);
                        } else {
                            fetchNews(item.stock, false);
                        }
                    };

                    chip.addEventListener('click', (e) => {
                        if (e.target.closest('.remove-chip')) return;
                        openChip();
                    });
                    chip.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            openChip();
                        }
                    });

                    removeIcon.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        await deleteHistoryItem(item.stock);
                        updateRecentSearchesDisplay();
                        if (document.getElementById('stockInput').value.trim().toUpperCase() === item.stock.toUpperCase()) {
                            document.getElementById('clearBtn').click();
                        }
                    });

                    recentSearches.appendChild(chip);
                });
            } catch (error) {
                console.error('Error loading recent searches:', error);
            }
        }

        async function checkServerCache(stock) {
            try {
                const response = await fetch(`/api/cache-status/${encodeURIComponent(stock)}`);
                if (response.ok) return (await response.json()).hasCache;
                return false;
            } catch (error) {
                console.error('Error checking cache status:', error);
                return false;
            }
        }

        function showWelcomeMessage() {
            document.getElementById('newsContainer').innerHTML = `
                <section class="desk">
                    <div class="desk-head">
                        <div>
                            <p class="eyebrow">On the desk</p>
                            <h2>Market headlines</h2>
                        </div>
                        <button type="button" class="text-btn" onclick="document.getElementById('stockInput').focus()">Search a ticker</button>
                    </div>
                    <div class="seg" role="tablist">
                        <button class="seg-btn nav-link active" id="nifty-tab" data-bs-toggle="tab" data-bs-target="#nifty-content" type="button" role="tab">Nifty 50</button>
                        <button class="seg-btn nav-link" id="dowjones-tab" data-bs-toggle="tab" data-bs-target="#dowjones-content" type="button" role="tab">Dow Jones</button>
                    </div>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="nifty-content" role="tabpanel">
                            <div id="nifty-news-container"><p class="waiting">Loading Nifty 50…</p></div>
                        </div>
                        <div class="tab-pane fade" id="dowjones-content" role="tabpanel">
                            <div id="dowjones-news-container"><p class="waiting">Loading Dow Jones…</p></div>
                        </div>
                    </div>
                </section>`;
            loadDefaultIndexNews();
        }

        async function loadDefaultIndexNews() {
            try {
                if (clientCache.has('NIFTY50')) {
                    const cachedNifty = clientCache.get('NIFTY50');
                    displayIndexNews('nifty-news-container', cachedNifty.news, 'Nifty 50', cachedNifty.cached || cachedNifty.stale);
                } else {
                    const niftyResponse = await fetch('/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'stock=NIFTY50'
                    });
                    if (niftyResponse.ok) {
                        const data = await niftyResponse.json();
                        data.timestamp = Date.now();
                        clientCache.set('NIFTY50', data);
                        displayIndexNews('nifty-news-container', data.news, 'Nifty 50', data.cached || data.stale);
                        updateRecentSearchesDisplay();
                    } else {
                        document.getElementById('nifty-news-container').innerHTML = `
                            <div class="state state-compact"><h3>Nifty 50 is unavailable</h3><p>Try again in a moment.</p></div>`;
                    }
                }
            } catch (error) {
                console.error('Error loading Nifty 50 news:', error);
                const niftyBox = document.getElementById('nifty-news-container');
                if (niftyBox) {
                    niftyBox.innerHTML = `<div class="state"><h3>Nifty 50 is unavailable</h3><p>${esc(error.message)}</p></div>`;
                }
            }

            try {
                if (clientCache.has('DOWJONES')) {
                    const cachedDow = clientCache.get('DOWJONES');
                    displayIndexNews('dowjones-news-container', cachedDow.news, 'Dow Jones', cachedDow.cached || cachedDow.stale);
                } else {
                    const dowResponse = await fetch('/search', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'stock=DOWJONES'
                    });
                    if (dowResponse.ok) {
                        const data = await dowResponse.json();
                        data.timestamp = Date.now();
                        clientCache.set('DOWJONES', data);
                        displayIndexNews('dowjones-news-container', data.news, 'Dow Jones', data.cached || data.stale);
                        updateRecentSearchesDisplay();
                    } else {
                        document.getElementById('dowjones-news-container').innerHTML = `
                            <div class="state"><h3>Dow Jones is unavailable</h3><p>Try again in a moment.</p></div>`;
                    }
                }
            } catch (error) {
                console.error('Error loading Dow Jones news:', error);
                const dowBox = document.getElementById('dowjones-news-container');
                if (dowBox) {
                    dowBox.innerHTML = `<div class="state"><h3>Dow Jones is unavailable</h3><p>${esc(error.message)}</p></div>`;
                }
            }
        }

        function displayIndexNews(containerId, news, indexName, earlier) {
            const container = document.getElementById(containerId);
            if (!container) return;

            if (!Array.isArray(news) || news.length === 0) {
                container.innerHTML = `
                    <div class="state">
                        <h3>No recent ${esc(indexName)} headlines</h3>
                        <p>The desk has nothing new for this index yet.</p>
                    </div>`;
                return;
            }

            const symbol = indexName === 'Nifty 50' ? 'NIFTY50' : 'DOWJONES';
            let html = '';
            if (earlier) {
                html += `<div class="cache-note"><span>Showing an earlier copy of these headlines.</span></div>`;
            }
            html += news.slice(0, 5).filter(Boolean).map(storyHtml).join('');
            html += `<p style="margin: 8px 0 16px;"><button type="button" class="text-btn" onclick="loadFullIndexNews('${symbol}')">All ${esc(indexName)} stories</button></p>`;
            container.innerHTML = html;
        }

        function loadFullIndexNews(indexSymbol) {
            document.getElementById('stockInput').value = indexSymbol;
            fetchNews(indexSymbol, false);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateRecentSearchesDisplay();
            if (!document.getElementById('stockInput').value) showWelcomeMessage();

            const goToTopBtn = document.getElementById('goToTopBtn');
            window.addEventListener('scroll', () => {
                if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                    goToTopBtn.classList.add('visible');
                } else {
                    goToTopBtn.classList.remove('visible');
                }
            });
            goToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
